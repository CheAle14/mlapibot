services:
  backend:
    image: ghcr.io/cheale14/mlapibot:${IMAGE_TAG:-rust}
    restart: on-failure:3
    networks:
      - shared
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${PORT}:${PORT}
    env_file: ".env"
    environment:
      - PORT=${PORT}
    volumes:
      - ${DATA_DIR}:/data
    healthcheck:
      test: curl -f http://localhost:${PORT}/healthcheck || exit 1
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
networks:
  shared:
    name: mlapibot_shared
    external: true