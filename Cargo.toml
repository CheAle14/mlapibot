[workspace]
members = [
    "bin/mlapibot-bin",
    "crates/mlapibot-analysis",
    "crates/mlapibot-api",
    "crates/mlapibot-common",
    "crates/mlapibot-database-v2",
    "crates/mlapibot-datastore",
    "crates/mlapibot-imgur",
    "crates/mlapibot-markdown",
    "crates/mlapibot-ocr",
    "crates/mlapibot-reddit",
    "crates/mlapibot-webhook",
]
resolver = "2"

[workspace.dependencies]
ab_glyph = "0.2.28"
annotate-snippets = "0.12.10"
anyhow = "1.0.86"
async-trait = "0.1.89"
base64ct = { version = "1.6.0" }
bumpalo = { version = "3.19.1" }
chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = "0.9.0"
futures = "0.3.32"
futures-util = "0.3.31"
hex_color = { version = "3.0.0" }
image = { version = "0.25.1", default-features = false, features = [
    "jpeg",
    "png",
] }
imageproc = { version = "0.25.0", default-features = false }
leptess = { git = "https://github.com/CheAle14/leptess" }
linkify = "0.10.0"
markdown = "1.0.0"
octocrab = { version = "0.49.5", features = ["stream"] }
ord-many = { git = "https://github.com/CheAle14/ord-many.git" }
postgres-types = { version = "0.2.12" }
reqwest = { version = "0.12.5", features = ["json", "multipart"] }
roux = { git = "https://github.com/CheAle14/roux.git", rev = "154dfbe1" }
rust-stemmers = "1.2.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
statuspage = { git = "https://github.com/CheAle14/statuspage.git" }
strsim = "0.11.1"
systemd_socket = "0.1.3"
tempfile = "3.18.0"
tera = { version = "1.20.0", default-features = false }
thiserror = "2.0.12"
tiny_http = "0.12.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-postgres = { version = "0.7.16", features = ["with-chrono-0_4"] }
toml = "0.9.11"
unic-emoji-char = "0.9.0"
