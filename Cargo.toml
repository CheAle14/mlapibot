[workspace]
members = [
    # "bin/mlapibot-test",
    "bin/mlapibot-bin",
    "crates/mlapibot-analysis",
    "crates/mlapibot-api",
    "crates/mlapibot-common",
    "crates/mlapibot-database-v2",
    "crates/mlapibot-imgur",
    "crates/mlapibot-markdown",
    "crates/mlapibot-ocr",
    "crates/mlapibot-reddit",
    "crates/mlapibot-webhook",
]
resolver = "2"

[workspace.dependencies]
ab_glyph = "0.2.32"
annotate-snippets = "0.12.15"
anyhow = "1.0.102"
async-trait = "0.1.89"
base64ct = { version = "1.8.3" }
bumpalo = { version = "3.20.2" }
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
digest-io = "0.1.0"
futures = "0.3.32"
futures-util = "0.3.32"
hex_color = { version = "3.0.0" }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
imageproc = { version = "0.26.1", default-features = false }
leptess = { git = "https://github.com/CheAle14/leptess" }
linkify = "0.10.0"
markdown = "1.0.0"
octocrab = { version = "0.49.7", default-features = false, features = [
    "stream",
    # Re-enable defaults other than 'rustls-ring'
    "default-client",
    "follow-redirect",
    "jwt-rust-crypto",
    "retry",
    "rustls",
    "timeout",
    "tracing",
] }
ord-many = { git = "https://github.com/CheAle14/ord-many.git" }
postgres-types = { version = "0.2.13" }
reqwest = { version = "0.13.2", features = ["json", "multipart"] }
roux = { git = "https://github.com/CheAle14/roux.git", rev = "58010986e6f43bb82e62856a242d386020bf1586", default-features = false, features = [
    "rustls",
] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
statuspage = { git = "https://github.com/CheAle14/statuspage.git" }
strsim = "0.11.1"
systemd_socket = "0.1.3"
tempfile = "3.27.0"
tera = { version = "1.20.1", default-features = false }
thiserror = "2.0.18"
tiny_http = "0.12.0"
tokio = { version = "1.51.0", features = ["full"] }
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4"] }
toml = "1.1.2"
unic-emoji-char = "0.9.0"
