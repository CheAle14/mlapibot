[package]
name = "mlapibot-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
mlapibot-analysis = { path = "../../crates/mlapibot-analysis" }
mlapibot-common = { path = "../../crates/mlapibot-common" }
mlapibot-database-v2 = { path = "../../crates/mlapibot-database-v2" }
mlapibot-webhook = { path = "../../crates/mlapibot-webhook" }
mlapibot-reddit = { path = "../../crates/mlapibot-reddit" }

anyhow = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
systemd_socket = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

clap = { version = "4.5.9", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
